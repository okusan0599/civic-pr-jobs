name: Daily collection and Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: civic-pr-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CRAWL_WORKERS: '6'
      REQUEST_DELAY: '1.5'
      SCHEDULER_ENABLED: 'false'
      CRAWL_ON_START: 'false'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore previous collection state
        run: python scripts/state_branch.py restore

      - name: Collect official sources (bounded, oldest-first)
        id: collect
        run: python -m app.cli crawl --pages 24 --seconds 14400

      - name: Save collection state, including partial progress
        if: always() && steps.collect.outcome != 'skipped'
        run: python scripts/state_branch.py save

      - name: Build search site
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          mkdir -p site
          python scripts/export_static.py --out site/index.html --hosted
          python scripts/export_data.py --out site
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
        if: always() && steps.collect.outcome != 'skipped'

      - uses: actions/upload-pages-artifact@v4
        if: always() && steps.collect.outcome != 'skipped'
        with:
          path: site

  deploy:
    needs: collect
    if: always() && needs.collect.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish search site
        id: deployment
        uses: actions/deploy-pages@v4
