async function api(path,options={}){const r=await fetch(path,{...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(state.token?{Authorization:'Bearer '+state.token}:{}),...(options.headers||{})}});if(!r.ok){let msg='HTTP '+r.status;try{const x=await r.json();msg=typeof x.detail==='string'?x.detail:JSON.stringify(x.detail||x);}catch{}throw new Error(msg);}return r.json();}
function updateDates(){const now=Date.now();for(const j of state.jobs){if(j.explicit_closed||(j.deadline_at&&new Date(j.deadline_at).getTime()<now))j.status='closed';else if(j.snapshot_only||j.source_changed||['unverified','error'].includes(j.source_state))j.status='unknown';const verified=Date.parse(j.verified_at||j.last_success||j.checked_at||'');j.stale=!Number.isFinite(verified)||now-verified>=7*86400000;if(j.stale&&j.status!=='closed')j.status='unknown';}}
async function load(){try{if(preview){state.jobs=embedded.jobs;state.meta=embedded.meta;state.sources=embedded.sources||[];}else{const [jobs,meta,sources]=await Promise.all([api('/api/jobs'),api('/api/meta'),api('/api/sources')]);state.jobs=jobs.items;state.meta=meta;state.sources=sources.items;}updateDates();renderHeader();render();}catch(e){document.getElementById('mainContent').innerHTML='';document.getElementById('errorArea').innerHTML=`<div class="error-banner">接続できませんでした：${esc(e.message)}<br>実運用版は付属の起動ファイルでサーバーを起動してください。単体で見る場合は「調査データ閲覧版.html」を開いてください。<br><button class="secondary" id="retryLoad" style="margin-top:12px">再接続</button></div>`;document.getElementById('retryLoad').onclick=load;}}
function renderHeader(){const m=state.meta;document.getElementById('totalJobs').innerHTML=`${state.jobs.length}<em>件</em>`;document.getElementById('updateDate').textContent=dateLabel(m.last_run?.finished_at||m.snapshot_date);document.getElementById('updateLabel').textContent=m.last_run?.finished_at?'最終巡回試行':'調査基準日';document.getElementById('savedCount').textContent=state.saved.size?`(${state.saved.size})`:'';
document.getElementById('modeLabel').innerHTML=`<i class="dot ${!preview&&m.scheduler_enabled?'live':''}"></i>${m.mode==='published_snapshot'?'外部生成の検索サイト':preview?'調査データ閲覧版':m.scheduler_enabled?'日次実行を設定済み':'手動更新モード'}`;
const msg=m.mode==='published_snapshot'?`<strong>定期収集の出力を表示</strong> — 最終巡回と未確認の範囲は収集状況をご確認ください。ページを開いているだけでは巡回しません。`:preview?`<strong>調査データ ${state.jobs.length}件（終了・要確認を含む）</strong> — 全自治体を収集済みではありません。このHTMLだけでは自動更新しません。`:`<strong>収集先 ${m.registered_sources||0}件／巡回試行 ${m.visited_sources||0}件</strong> — 全件収集済み・漏れなしを意味しません。取得失敗は未確認として保持します。`;
document.getElementById('notice').innerHTML=ICONS.info+`<span>${msg} <a href="#coverage" data-link-view="coverage">確認できた範囲を見る</a></span>`;}
function filtered(){const f=state.filters;let rows=state.jobs.filter(j=>{const text=[j.title,j.municipality,j.prefecture,j.summary,j.hiring_policy,j.requirements,j.responsibilities,...(j.tags||[])].join(' ').toLowerCase();return(f.q.trim().toLowerCase().split(/\s+/).every(w=>text.includes(w)))&&(!f.entity_type||(f.entity_type==='government'?['national','prefecture','municipality','ward'].includes(j.entity_type||'municipality'):j.entity_type===f.entity_type))&&(!f.region||j.region===f.region)&&(!f.prefecture||j.prefecture===f.prefecture)&&(!f.status||(f.status==='not_closed'?j.status!=='closed':f.status==='active'?['open','upcoming','rolling'].includes(j.status):j.status===f.status))&&(!f.category||j.category===f.category)&&(!f.tag||(j.tags||[]).includes(f.tag))&&(!f.employment||j.employment_type===f.employment)&&(!f.salary||(j.salary_annual_min||0)>=Number(f.salary))&&(!f.term||j.term_years===Number(f.term))&&(!f.experience||j.experience_required)&&(state.view!=='saved'||state.saved.has(j.id));});
const compare=(a,b)=>f.sort==='salary'?(b.salary_annual_min||0)-(a.salary_annual_min||0):f.sort==='updated'?String(b.updated_at||b.checked_at||'').localeCompare(String(a.updated_at||a.checked_at||'')):f.sort==='region'?String(a.prefecture).localeCompare(String(b.prefecture),'ja'):new Date(a.deadline_at||'2099-01-01')-new Date(b.deadline_at||'2099-01-01');return rows.sort(compare);}
function filtersHtml(){const f=state.filters;const prefs=state.meta.prefectures||[];const regions=[...new Set(prefs.map(p=>p.region))];const tags=[...new Set(state.jobs.flatMap(j=>j.tags||[]))];return `<aside class="filters ${state.mobileFilters?'mobile-open':''}" aria-label="検索条件"><div class="filter-heading">条件で絞り込む<button class="text-button" id="resetFilters">リセット</button></div>
<div class="field"><label for="f-q">キーワード</label><input id="f-q" class="input" placeholder="例：広報戦略、SNS、機関名" value="${esc(f.q)}" autocomplete="off"></div>

<div class="field"><label for="f-category">募集タイプ</label><select id="f-category" class="select">${option('career','キャリア・専門職',f.category)}${option('support','短時間・地域支援など',f.category)}${option('','すべての募集タイプ',f.category)}</select></div>
<div class="field"><label for="f-status">受付状況</label><select id="f-status" class="select">${option('not_closed','終了以外（要確認を含む）',f.status)}${option('','終了済みも含む',f.status)}${option('active','受付中＋受付開始前',f.status)}${Object.entries(statusNames).map(([v,l])=>option(v,l,f.status)).join('')}</select></div>

<div class="field"><label for="f-term">当初の任期</label><select id="f-term" class="select">${option('','指定しない',f.term)}${[1,2,3,5].map(n=>option(n,n+'年',f.term)).join('')}</select></div>
<div class="field"><label for="f-employment">任用・契約の区分</label><select id="f-employment" class="select">${option('','すべて',f.employment)}${[...new Set(state.jobs.map(j=>j.employment_type))].map(t=>option(t,t,f.employment)).join('')}</select></div>

function card(j){const saved=state.saved.has(j.id),days=daysLeft(j);return `<article class="job-card"><div class="card-top"><span class="location">${ICONS.pin}${esc(j.prefecture)} <span>／ ${esc(j.region)}</span></span><button class="bookmark ${saved?'saved':''}" data-save="${esc(j.id)}" aria-label="${saved?'保存を解除':'案件を保存'}" aria-pressed="${saved}">${saved?ICONS.saved:ICONS.save}</button></div><div class="municipality">${esc(entityNames[j.entity_type]||'市区町村')} ／ ${esc(j.municipality)}</div><h2 class="job-title">${esc(j.title)}</h2><div class="role-line"><span>${esc(j.role_level||'役職未確認')}</span><span>・</span><span>${esc(j.employment_type)}</span>${badge(j)}</div><p class="description">${esc(j.summary)}</p><div class="tags">${(j.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="card-data"><dl style="margin:0"><div class="data-line salary"><dt>給与</dt><dd>${esc(j.salary_text||'原典確認')}</dd></div><div class="data-line"><dt>任期</dt><dd>${esc(j.term_text||'原典確認')}</dd></div><div class="data-line"><dt>経験</dt><dd>${j.experience_years?esc(j.experience_years)+'年以上の条件記載':j.experience_required?'経験内容の条件あり':'詳細は原典確認'}</dd></div></dl><div class="reference-mark">${esc(verificationNames[j.verification]||'要確認')}${j.stale?' ・情報の再確認を推奨':''}</div><div class="deadline"><span>応募期限 <b>${dateLabel(j.deadline_at)}</b></span><span class="${days!==null&&days>=0&&days<=7?'urgent':''}">${j.status==='open'&&days!==null?(days<=0?'本日締切':`残り${days}日`):j.status==='upcoming'?dateLabel(j.opens_at)+'受付開始':j.status==='unknown'?'原典を確認':j.status==='closed'?'受付終了':''}</span></div></div><div class="card-footer"><label class="compare-check"><input type="checkbox" data-compare="${esc(j.id)}" ${state.compare.has(j.id)?'checked':''}>比較する</label><button class="details-btn" data-detail="${esc(j.id)}">募集の詳細 ${ICONS.arrow}</button></div></article>`;}

function emptyHtml(){return `<div class="empty"><div style="font-size:26px;color:#a1b09c">⌕</div><h3>${state.view==='saved'?'保存した案件が見つかりません':'この条件の案件はまだ登録されていません'}</h3><p>該当表示がない地域でも、「募集がない」と断定するものではありません。未巡回・未取得の収集先は「収集状況」で確認できます。</p><button class="secondary" data-reset>条件をリセット</button></div>`;}
function renderSearch(){const rows=filtered();const f=state.filters;const chips=[entityNames[f.entity_type],f.region,f.prefecture,f.category==='career'?'キャリア・専門職':f.category==='support'?'短時間・地域支援':'',f.status?(f.status==='not_closed'?'終了以外':f.status==='active'?'受付中＋受付開始前':statusNames[f.status]):'',f.tag,f.salary?Number(f.salary)/10000+'万円以上':'',f.term?f.term+'年任期':'',f.q?`「${f.q}」`:''].filter(Boolean);document.getElementById('mainContent').innerHTML=`${state.view==='saved'?'<div class="page-heading"><div><h2>保存した案件</h2><p>気になる募集を残して、条件を比較できます。</p></div></div>':''}<div class="search-layout">${filtersHtml()}<section><div class="results-header"><div class="result-count"><strong id="resultNumber">${rows.length}</strong>件 <small>／ 全${state.jobs.length}案件</small></div><button class="secondary" id="mobileFilters">絞り込み</button><div class="results-actions"><select id="sort" aria-label="並び順">${option('deadline','応募期限が近い順',f.sort)}${option('salary','公表年収が高い順',f.sort)}${option('updated','更新が新しい順',f.sort)}${option('region','都道府県順',f.sort)}</select><div class="segmented"><button data-layout="cards" class="${state.layout==='cards'?'active':''}" aria-label="カード表示">${ICONS.grid}</button><button data-layout="table" class="${state.layout==='table'?'active':''}" aria-label="表形式で表示">${ICONS.list}</button></div><button class="secondary" id="exportCsv">↓ <span class="csv-label">CSV</span></button></div></div><div class="active-filters">${chips.map(c=>`<span class="filter-chip">${esc(c)}</span>`).join('')}</div><div id="results">${rows.length?(state.layout==='table'?table(rows):`<div class="cards">${rows.map(card).join('')}</div>`):emptyHtml()}</div>${state.view==='saved'?savedSearchesHtml():''}</section></div>`;
for(const key of ['entity_type','region','prefecture','category','status','tag','salary','term','employment']){document.getElementById('f-'+key).onchange=e=>{f[key]=e.target.value;if(key==='region')f.prefecture='';renderSearch();};}
let typing;document.getElementById('f-q').oninput=e=>{f.q=e.target.value;clearTimeout(typing);typing=setTimeout(()=>{const pos=e.target.selectionStart;renderSearch();const input=document.getElementById('f-q');input.focus();input.setSelectionRange(pos,pos);},220);};document.getElementById('f-experience').onchange=e=>{f.experience=e.target.checked;renderSearch();};document.getElementById('resetFilters').onclick=resetFilters;document.getElementById('sort').onchange=e=>{f.sort=e.target.value;renderSearch();};document.getElementById('saveSearch').onclick=saveSearch;document.getElementById('exportCsv').onclick=exportCsv;document.getElementById('mobileFilters').onclick=()=>{state.mobileFilters=!state.mobileFilters;document.querySelector('.filters').classList.toggle('mobile-open',state.mobileFilters);};}

function saveSearch(){const name=prompt('検索条件の名前', [state.filters.region||'全国',state.filters.tag||'広報専門職'].join('・'));if(!name)return;state.searches.push({name:name.slice(0,80),filters:{...state.filters}});writeLocal('civic-pr-searches',state.searches);toast('検索条件を保存しました。保存した案件の画面から呼び出せます。');}
function exportCsv(){const rows=filtered();const columns=[['募集機関','municipality'],['機関種別','entity_type'],['受付状況','status'],['確認方法','research_method'],['都道府県','prefecture'],['地域','region'],['職名','title'],['役職','role_level'],['募集区分','employment_type'],['採用方針','hiring_policy'],['担当業務','responsibilities'],['応募条件','requirements'],['給与','salary_text'],['公表年収・年収例','salary_annual_min'],['給与の注意','salary_note'],['任期','term_text'],['更新条件','renewal_text'],['応募締切','deadline_at'],['締切の注意','deadline_note'],['原典URL','source_url'],['確認日時','checked_at']];const cell=x=>{let s=String(x??'');if(/^[\s]*[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const csv='\ufeff'+[columns.map(c=>cell(c[0])).join(','),...rows.map(j=>columns.map(c=>cell(j[c[1]])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='civic-pr-jobs-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(rows.length+'件を書き出しました。');}
function renderCoverage(){const m=state.meta,r=m.last_run,a=m.research_audit||{},prefCounts=m.per_prefecture||[];
document.getElementById('mainContent').innerHTML=`<div class="page-heading"><div><h2>何を確認できたか</h2><p>キーワード検索・名簿登録・個別巡回・公開稼働を、それぞれ別に表示します。</p></div><button class="primary" id="goManage">更新・収集先を管理 ${ICONS.arrow}</button></div>

<section class="panel"><h3>登録した収集先</h3><div class="toolbar"><input id="sourceQuery" class="input" placeholder="機関名・都道府県・国の機関で絞り込み" aria-label="収集先の検索"><select id="sourceState" class="select" style="max-width:190px"><option value="">すべての状態</option value="unvisited">未巡回</option><option value="ok">採用ページ到達</option><option value="partial">一部未取得</option><option value="error">取得失敗</option></select></div><div id="sourceResults"></div></section>`;
document.getElementById('goManage').onclick=()=>setView('admin');document.getElementById('sourceQuery').oninput=renderSources;document.getElementById('sourceState').onchange=renderSources;renderSources();}
function renderSources(){const q=document.getElementById('sourceQuery').value;const filter=document.getElementById('sourceState').value;const rows=state.sources.filter(s=>(!q||(s.name+s.pref).includes(q))&&(!filter||s.state===filter));const names={unvisited:'未巡回',ok:'採用ページ到達',partial:'一部未取得',error:'取得失敗',blocked:'巡回対象外'};document.getElementById('sourceResults').innerHTML=`<p class="mini">${rows.length}件。最大150件を表示しています。機関名簿はJ-LIS、国の機関はe-Govを基に拡張します。</p><div class="table-wrap"><table class="source-table"><thead><tr><th>収集先</th><th>状態</th><th>確認日時</th><th>補足</th></tr></thead><tbody>${rows.slice(0,150).map(s=>`<tr><td><a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a><div class="mini">${esc(s.pref)}／${esc(entityNames[s.kind]||s.kind)}</div></td><td>${esc(names[s.state]||s.state)}</td><td>${s.last_checked?dateLabel(s.last_checked,true):'未巡回'}</td><td class="mini" style="max-width:340px;overflow-wrap:anywhere">${esc((s.error||s.provenance||'').slice(0,200))}</td></tr>`).join('')}</tbody></table></div>`;}
function renderGuide(){document.getElementById('mainContent').innerHTML=`<section class="guide"><h2>「経験を生かせる募集」を、条件で見つける。</h2><div class="steps"><div class="step"><span class="n">01 / FIND</span><h3>地域と役割を選ぶ</h3><p>広報戦略・ブランディング・観光・SNSなど、任される仕事で絞り込みます。キャリア専門職と短時間の地域支援を分けて表示します。</p></div><div class="step"><span class="n">02 / COMPARE</span><h3>給与と任期を比べる</h3><p>カードの「比較する」で最大3件を横並びに。公表年収と月額は区別し、任期と更新条件も分けています。</p></div><div class="step"><span class="n">03 / VERIFY</span><h3>最後は原典を確認する</h3><p>詳細画面に、公式募集ページと確認根拠を表示。応募資格や締切時刻などは、必ず自治体の募集要項で確認してください。</p></div></div><section class="panel" style="margin-top:22px"><h3>データの読み方</h3><p><strong>前回調査情報：</strong>実在する募集を登録しています。一部の給与・条件は前回調査の転記で、今回未再取得の項目を明示しています。<br><strong>自動抽出・要原典確認：</strong>巡回処理が公式サイトから抽出。曖昧な期限や複数職種の混在は要確認キューに回します。<br><strong>管理者確認済み：</strong>管理画面で内容を点検し、公開した募集です。<br><strong>受付状況 要確認：</strong>受付開始・締切が未確定、原典変更、または再確認できていない状態です。</p><p>原典の通信エラーや削除だけで「募集終了」にはしません。締切が過ぎたものは日付で終了扱いとし、過去の情報を残します。未確認の給与を推定したり、月給×12を年収と表示したりはしません。</p></section><section class="panel"><h3>このシステムでできること／運用の前提</h3><p>検索・保存・比較・CSV出力、公式サイト名簿の取得、採用ページ／PDFの巡回、毎日の再確認、変更履歴、管理者による公開判定を備えています。AI・検索APIのキーは不要です。</p><p>毎日の巡回には、ネット接続があり起動し続けるPCまたはサーバーが必要です。調査データ閲覧版HTMLだけで自動収集は動きません。全自治体の全募集を完全に取得する保証はなく、収集状況画面で未取得を管理します。</p></section></section>`;}
function renderAdmin(){document.getElementById('mainContent').innerHTML=`<div class="page-heading"><div><h2>更新とデータ管理</h2><p>巡回・収集先の追加・要確認案件の公開は管理トークンで保護されます。</p></div></div>${preview?'<div class="info-banner"><strong>調査データ閲覧版です。</strong> この画面から実際の巡回・登録はできません。付属の実運用版を起動してください。</div>':''}<section class="panel admin-form"><h3>管理トークン</h3><div class="toolbar"><input id="adminToken" type="password" class="input" placeholder="ADMIN_TOKENを入力" autocomplete="off" value="${esc(state.token)}"><button class="secondary" id="setToken">接続確認</button></div><p>トークンはこの画面のメモリ内にだけ保持し、ブラウザ保存領域には保存しません。</p></section><section class="panel"><h3>公式サイトを更新</h3><div class="toolbar"><select class="select" style="max-width:220px" id="crawlPref"><option value="">全国・国の機関を対象にする</option><option value="国の機関">国の機関のみ</option>${(state.meta.prefectures||[]).map(p=>option(p.name,p.name,'')).join('')}</select><button id="startCrawl" class="primary" ${preview?'disabled':''}>巡回を開始</button><button id="refreshRegistry" class="secondary" ${preview?'disabled':''}>全国名簿も再取得して巡回</button></div><p>毎日更新：${state.meta.scheduler_enabled?'設定済み（毎日'+state.meta.daily_hour_jst+':00、日本時間）':'この起動環境では未設定'}。二重起動は防止します。進捗は「収集状況」で確認できます。</p></section><section class="panel admin-form"><h3>見つけた公式募集ページを追加</h3><div class="form-grid"><div class="field"><label for="addName">募集機関名</label><input id="addName" class="input" placeholder="例：豊中市"></div><div class="field"><label for="addPref">都道府県</label><select id="addPref" class="select"><option value="国の機関">国の機関</option>${(state.meta.prefectures||[]).map(p=>option(p.name,p.name,'')).join('')}</select></div></div><div class="field"><label for="addOfficial">自治体の公式ホームページ</label><input id="addOfficial" class="input" placeholder="https://..."></div><div class="field"><label for="addRecruit">採用ページ／募集ページ</label><input id="addRecruit" class="input" placeholder="https://..."></div><button id="addSource" class="secondary" ${preview?'disabled':''}>収集先として登録</button><p>公式ページが外部採用サイトを案内している場合のみ、その募集ページを追加してください。</p></section><section class="panel"><div class="page-heading" style="margin:0"><div><h3>要確認の募集候補</h3><p>自動判定できない締切・複数職種・原典変更を確認します。</p></div><button class="secondary" id="loadReviews" ${preview?'disabled':''}>要確認を読み込む</button></div><div id="reviewsArea"></div></section>`;
document.getElementById('setToken').onclick=async()=>{state.token=document.getElementById('adminToken').value.trim();if(preview){toast('調査データ閲覧版では接続できません。');return;}try{await api('/api/admin/reviews');toast('管理機能に接続しました。');}catch(e){toast(e.message);}};
for(const [id,refresh] of [['startCrawl',false],['refreshRegistry',true]])document.getElementById(id).onclick=async()=>{state.token=document.getElementById('adminToken').value.trim();try{await api('/api/admin/crawl',{method:'POST',body:JSON.stringify({prefecture:document.getElementById('crawlPref').value||null,refresh_registry:refresh})});toast('巡回を起動しました。収集状況に進捗を表示します。');setView('coverage');}catch(e){toast(e.message);}};
document.getElementById('addSource').onclick=async()=>{state.token=document.getElementById('adminToken').value.trim();try{await api('/api/admin/sources',{method:'POST',body:JSON.stringify({name:document.getElementById('addName').value,prefecture:document.getElementById('addPref').value,kind:document.getElementById('addPref').value==='国の機関'?'national':'municipality',official_url:document.getElementById('addOfficial').value,recruitment_url:document.getElementById('addRecruit').value||null})});toast('収集先を登録しました。次回巡回で取得します。');await load();}catch(e){toast(e.message);}};
document.getElementById('loadReviews').onclick=async()=>{state.token=document.getElementById('adminToken').value.trim();try{state.reviews=(await api('/api/admin/reviews')).items;document.getElementById('reviewsArea').innerHTML=state.reviews.length?`<div class="cards" style="margin-top:20px">${state.reviews.map(j=>`<div class="panel"><div class="mini">${esc(j.prefecture)}／${esc(j.municipality)}</div><h3>${esc(j.title)}</h3><p>${esc(j.extraction_note||'原典の変更を検出')}</p><button class="secondary" data-review="${esc(j.id)}">原典と抽出内容を確認</button></div>`).join('')}</div>`:'<p>現在の要確認候補はありません。</p>';}catch(e){toast(e.message);}};}
function setView(v){state.view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='saved')state.filters={...defaults,category:'',entity_type:'',status:''};render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){if(['jobs','saved'].includes(state.view))renderSearch();else if(state.view==='coverage')renderCoverage();else if(state.view==='guide')renderGuide();else renderAdmin();renderTray();}
function showDetail(id){const j=state.jobs.find(x=>x.id===id);if(!j)return;focusBeforeDialog=document.activeElement;const field=(title,body,note)=>`<section class="detail-section"><h3>${esc(title)}</h3><p>${esc(body||'原典確認')}</p>${note?`<p class="detail-note">${esc(note)}</p>`:''}</section>`;document.getElementById('drawer').innerHTML=`<div class="drawer-head"><span class="location">${ICONS.pin}${esc(j.prefecture)}／${esc(j.municipality)}</span><button class="close-button" data-close aria-label="閉じる">×</button></div>${badge(j)}<h2>${esc(j.title)}</h2><div class="role-line">${esc(j.role_level)} ／ ${esc(j.employment_type)} ／ ${esc(j.work_style)}</div><p class="summary">${esc(j.summary)}</p><div class="tags">${(j.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="drawer-actions"><a class="primary" href="${esc(safeUrl(j.source_url))}" target="_blank" rel="noopener noreferrer">${j.source_url_is_job===false?'公式サイト・採用入口を開く':'公式募集ページを開く'} ↗</a><button class="secondary" data-save="${esc(j.id)}">${state.saved.has(j.id)?'保存済み':'案件を保存'}</button></div>${field('この人材に期待していること',j.hiring_policy)}${field('担当する仕事',j.responsibilities)}${field('求められる経験・応募条件',j.requirements,j.experience_note)}${field('給与・年収',j.salary_text,j.salary_note)}${field('当初の任期と更新条件',j.term_text,j.renewal_text)}${field('応募期限',j.deadline_at?new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',dateStyle:'full',timeStyle:'short'}).format(new Date(j.deadline_at)):'未確認',j.deadline_note)}${field('確認状況',verificationNames[j.verification],j.extraction_note)}${j.discovery_url?`<section class="detail-section"><h3>発見時の参照先</h3><a href="${esc(safeUrl(j.discovery_url))}" target="_blank" rel="noopener noreferrer">募集を発見したページ ↗</a><p class="detail-note">二次情報・検索結果は、応募可否の最終確認に代用しません。</p></section>`:''}${j.fetch_error?field('直近の取得エラー',j.fetch_error):''}<section class="detail-section"><h3>参照した原典・募集要項</h3>${(j.evidence||[]).map(e=>`<a class="evidence-link" href="${esc(safeUrl(e.url))}" target="_blank" rel="noopener noreferrer"><strong>${esc(e.field)} ↗</strong><span>${esc(e.text)}</span></a>`).join('')}${(j.attachment_urls||[]).map((u,i)=>`<a class="evidence-link" href="${esc(safeUrl(u))}" target="_blank" rel="noopener noreferrer"><strong>募集要項PDF ${i+1} ↗</strong><span>別タブで原典を開きます。</span></a>`).join('')}<p class="detail-note">最終確認 ${esc(j.checked_at||'未確認')}<br>表示に不足や更新遅れがある場合があります。応募前に必ず原典を確認してください。</p></section><section class="detail-section"><h3>変更履歴</h3><div id="jobHistory"><p class="mini">${preview?'初期調査データです。巡回後に変更履歴を蓄積します。':'読み込み中…'}</p></div></section>`;document.getElementById('drawerBackdrop').classList.add('open');document.body.style.overflow='hidden';document.getElementById('drawer').focus();if(!preview)api('/api/history?job_id='+encodeURIComponent(id)).then(x=>{const el=document.getElementById('jobHistory');if(el)el.innerHTML=x.items.length?x.items.map(h=>`<p class="mini">${esc(h.at)} — ${esc(h.summary)}</p>`).join(''):'<p class="mini">変更履歴はまだありません。</p>';}).catch(()=>{});}
function closeDetail(){document.getElementById('drawerBackdrop').classList.remove('open');document.body.style.overflow='';focusBeforeDialog?.focus();}
function toggleSave(id){if(state.saved.has(id))state.saved.delete(id);else state.saved.add(id);writeLocal('civic-pr-saved',[...state.saved]);renderHeader();if(['jobs','saved'].includes(state.view))renderSearch();document.querySelectorAll(`[data-save="${CSS.escape(id)}"]`).forEach(b=>{if(b.classList.contains('bookmark')){b.innerHTML=state.saved.has(id)?ICONS.saved:ICONS.save;b.classList.toggle('saved',state.saved.has(id));}else b.textContent=state.saved.has(id)?'保存済み':'案件を保存';});}
function renderTray(){const tray=document.getElementById('compareTray');tray.classList.toggle('hidden',state.compare.size===0);tray.innerHTML=`<p>${state.compare.size}件を比較リストに追加 <span style="color:#9eafa1">／ 最大3件</span></p><button id="openCompare">比較する ${ICONS.arrow}</button><button class="clear" id="clearCompare" aria-label="比較リストをクリア">×</button>`;document.getElementById('openCompare').onclick=showCompare;document.getElementById('clearCompare').onclick=()=>{state.compare.clear();render();};}
function showCompare(){const rows=state.jobs.filter(j=>state.compare.has(j.id));if(!rows.length)return;focusBeforeDialog=document.activeElement;const fields=[['募集区分','employment_type'],['採用方針','hiring_policy'],['担当する仕事','responsibilities'],['給与','salary_text'],['給与の注意点','salary_note'],['当初任期','term_text'],['更新の可能性','renewal_text'],['経験・応募条件','requirements'],['応募期限の注意','deadline_note']];const modal=document.getElementById('compareModal');modal.innerHTML=`<div class="drawer-head"><h2 style="margin:0;font-size:21px">案件を比較する</h2><button class="close-button" id="closeCompare" aria-label="比較を閉じる">×</button></div><div class="compare-grid" style="grid-template-columns:repeat(${rows.length},minmax(260px,1fr))">${rows.map(j=>`<div class="comparison-col"><div class="comparison-cell"><p class="mini">${esc(j.prefecture)}／${esc(j.municipality)}</p><h3>${esc(j.title)}</h3>${badge(j)}<div style="margin-top:14px"><a href="${esc(safeUrl(j.source_url))}" target="_blank" rel="noopener noreferrer">${j.source_url_is_job===false?'公式採用入口（募集本文は要確認）':'公式募集ページ'} ↗</a></div></div>${fields.map(([label,key])=>`<div class="comparison-cell"><h4>${label}</h4><p>${esc(j[key]||'原典確認')}</p></div>`).join('')}</div>`).join('')}</div>`;modal.classList.add('open');document.body.style.overflow='hidden';modal.focus();document.getElementById('closeCompare').onclick=closeCompare;}
function closeCompare(){document.getElementById('compareModal').classList.remove('open');document.body.style.overflow='';focusBeforeDialog?.focus();}
function editReview(id){const job=state.reviews.find(j=>j.id===id);if(!job)return;const proposal=job.proposed_payload||{...job};delete proposal.proposed_payload;focusBeforeDialog=document.activeElement;document.getElementById('drawer').innerHTML=`<div class="drawer-head"><h3>募集情報の確認・公開</h3><button class="close-button" data-close aria-label="閉じる">×</button></div><p>原典と比較し、下のJSONを修正して公開してください。曖昧な給与は数値をnullのままにします。日時には +09:00 を付けます。</p><a class="secondary" href="${esc(safeUrl(job.source_url))}" target="_blank" rel="noopener noreferrer">原典を開く ↗</a><div class="field" style="margin-top:18px"><textarea id="reviewJson" class="json-editor" aria-label="公開する募集情報のJSON">${esc(JSON.stringify(proposal,null,2))}</textarea></div><div class="drawer-actions"><button class="primary" id="publishReview">この内容で公開</button><button class="secondary" id="hideReview">対象外として非表示</button></div>`;document.getElementById('drawerBackdrop').classList.add('open');document.body.style.overflow='hidden';document.getElementById('drawer').focus();for(const [button,action]of[['publishReview','publish'],['hideReview','hide']])document.getElementById(button).onclick=async()=>{try{const payload=JSON.parse(document.getElementById('reviewJson').value);await api('/api/admin/review/'+encodeURIComponent(id),{method:'POST',body:JSON.stringify({action,payload})});closeDetail();toast('確認結果を保存しました。');await load();}catch(e){toast(e.message);}};}
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;if(b.dataset.view)setView(b.dataset.view);if(b.dataset.linkView){e.preventDefault();setView(b.dataset.linkView);}if(b.dataset.detail)showDetail(b.dataset.detail);if(b.dataset.save)toggleSave(b.dataset.save);if(b.hasAttribute('data-close'))closeDetail();if(b.hasAttribute('data-reset'))resetFilters();if(b.dataset.layout){state.layout=b.dataset.layout;renderSearch();}if(b.dataset.review)editReview(b.dataset.review);if(b.dataset.searchLoad!==undefined){state.filters={...defaults,...state.searches[Number(b.dataset.searchLoad)].filters};state.view='jobs';document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view==='jobs'));render();}if(b.dataset.searchDelete!==undefined){state.searches.splice(Number(b.dataset.searchDelete),1);writeLocal('civic-pr-searches',state.searches);render();}});
document.addEventListener('change',e=>{const id=e.target.dataset?.compare;if(!id)return;if(e.target.checked){if(state.compare.size>=3){e.target.checked=false;toast('比較できるのは最大3件です。');return;}state.compare.add(id);}else state.compare.delete(id);renderTray();});
document.getElementById('drawerBackdrop').addEventListener('click',e=>{if(e.target.id==='drawerBackdrop')closeDetail();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDetail();closeCompare();}if(e.key==='Tab'){const modal=document.getElementById('compareModal').classList.contains('open')?document.getElementById('compareModal'):document.getElementById('drawerBackdrop').classList.contains('open')?document.getElementById('drawer'):null;if(!modal)return;const els=[...modal.querySelectorAll('button,a[href],input,textarea,select,[tabindex="0"]')].filter(el=>!el.disabled);if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===modal)){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
load();
setInterval(()=>{updateDates();if(['jobs','saved'].includes(state.view))renderSearch();},60000);
if(!preview)setInterval(async()=>{try{state.meta=await api('/api/meta');renderHeader();if(state.view==='coverage'){state.sources=(await api('/api/sources')).items;renderCoverage();}if(state.meta.last_run?.finished_at&&state.meta.last_run.finished_at!==load.lastFinished){load.lastFinished=state.meta.last_run.finished_at;state.jobs=(await api('/api/jobs')).items;if(['jobs','saved'].includes(state.view))renderSearch();}}catch{}},15000);
</script>
</body></html>
